<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1024px; height: 1024px; overflow: hidden; }
  body { background: #f4efe3; color: #15171c; font-family: "Segoe UI", Arial, sans-serif; position: relative; }
  .g { font-family: Georgia, serif; }
  .eu { --c: #1d4e89; } .me { --c: #a4161a; } .as { --c: #b5651d; }
  .am { --c: #6a3d9a; } .af { --c: #2d6a4f; } .oc { --c: #0f766e; } .wd { --c: #3a3d44; }

  .top { height: 22px; background: #14213d; color: #f4efe3; display: flex; justify-content: space-between; align-items: center;
    padding: 0 14px; font-size: 11.5px; font-weight: 700; letter-spacing: .1em; }
  .date { text-align: center; font-family: Georgia, serif; font-weight: 700; color: #14213d; white-space: nowrap;
    font-size: 70px; line-height: 72px; }
  .utc { margin: 0 14px; background: #14213d; color: #f4efe3; display: flex; gap: 16px; padding: 3px 10px;
    font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .utc .l { color: #9fb3d1; letter-spacing: .12em; font-weight: 800; font-size: 11.5px; }
  .utc b { color: #f4d35e; margin-right: 4px; }

  .row { display: grid; gap: 8px; margin: 7px 14px 0; }
  .card { background: #fffdf8; border: 1px solid #d6ccb6; position: relative; overflow: hidden; }
  .card svg.art { display: block; width: 100%; }
  .n { position: absolute; top: 5px; left: 5px; min-width: 20px; height: 20px; border-radius: 10px; background: #14213d; color: #fff;
    font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; padding: 0 5px; }
  .badge { position: absolute; top: 5px; right: 5px; font-size: 10px; font-weight: 800; letter-spacing: .06em; color: #fff;
    padding: 2px 5px; border-radius: 2px; background: #2d6a4f; }
  .badge.claim { background: #b5651d; }
  .txt { padding: 5px 9px 7px; }
  .k { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--c); }
  .card h2 { font-family: Georgia, serif; line-height: 1.08; margin-top: 2px; }
  .card p { font-size: 13.5px; line-height: 17px; color: #2b2e35; margin-top: 3px; }
  .s { font-size: 10px; color: #6b6f78; margin-top: 2px; }
  .lead { border-top: 5px solid var(--c); }
  .lead h2 { font-size: 25px; }
  .mod { border-top: 4px solid var(--c); }
  .mod h2 { font-size: 17px; }
  .side .badge { right: auto; left: 5px; top: 30px; }

  .ind { display: grid; grid-template-columns: repeat(6, 1fr); margin: 7px 14px 0; background: #14213d; color: #f4efe3; }
  .ind div { text-align: center; padding: 3px 2px 4px; border-right: 1px solid #2c3b5e; }
  .ind div:last-child { border-right: 0; }
  .ind b { display: block; font-family: Georgia, serif; font-size: 22px; line-height: 24px; color: #f4d35e; }
  .ind span { font-size: 10.5px; font-weight: 600; }

  .notes { display: grid; gap: 0 14px; }
  .nt { display: flex; gap: 6px; align-items: flex-start; border-bottom: 1px dotted #c3b89f; padding: 3px 0 3px; }
  .nt i { flex: none; font-style: normal; font-size: 10px; font-weight: 800; color: #fff; background: var(--c);
    border-radius: 8px; min-width: 18px; text-align: center; padding: 0 3px; margin-top: 3px; }
  .nt b { display: block; font-family: Georgia, serif; font-size: 15px; line-height: 18px; }
  .nt em { display: block; font-style: normal; font-size: 9.5px; line-height: 12px; color: #6b6f78; white-space: nowrap; }
  .map { background: #dfe9ee; border: 1px solid #c4d3da; position: relative; }
  .map .cap { position: absolute; left: 6px; top: 4px; font-size: 10.5px; font-weight: 800; letter-spacing: .08em; color: #14213d; }
  .check { margin: 6px 14px 0; border: 2px solid #a4161a; background: #fff5f1; padding: 3px 9px; font-size: 11px; line-height: 14px; }
  .check b { color: #a4161a; letter-spacing: .07em; margin-right: 5px; }
  .foot { position: absolute; left: 0; right: 0; bottom: 0; height: 20px; background: #14213d; color: #f4efe3; display: flex;
    justify-content: space-between; align-items: center; padding: 0 14px; font-size: 10px; font-weight: 600; }
  .foot .bd { background: #2d6a4f; padding: 0 4px; border-radius: 2px; font-weight: 800; }
  .foot .bd.claim { background: #b5651d; }
</style>

// Scenes keep their whole picture ("meet"); the band behind them takes the scene's own sky colour.
function art(name, h) {
  const bg = ART[name].match(/fill="([^"]+)"/)[1];
  return `<svg class="art" viewBox="0 0 160 90" preserveAspectRatio="xMidYMid meet" style="height:${h}px;background:${bg}">${ART[name]}</svg>`;
}
function badge(x) { return x.claim ? '<span class="badge claim">CLAIM</span>' : '<span class="badge">REPORTED</span>'; }
function lead(x, h, size) {
  return `<div class="card lead ${x.r}">${art(x.art, h)}<span class="n">${x.no}</span>${badge(x)}<div class="txt"><div class="k">${x.k}</div><h2 style="font-size:${size}px">${x.h}</h2><p>${x.d}</p><div class="s">${x.s}</div></div></div>`;
}
function mod(x, h) {
  return `<div class="card mod ${x.r}">${art(x.art, h)}<span class="n">${x.no}</span>${badge(x)}<div class="txt"><div class="k">${x.k}</div><h2>${x.h}</h2><div class="s">${x.s}</div></div></div>`;
}

  return `<div class="notes" style="grid-template-columns:repeat(${cols},1fr)">` + NOTES.map((x) =>

function map(w, h, title) {

  return `<div class="map" style="width:${w}px;height:${h}px"><svg width="${w}" height="${h}">${land}${pins}</svg><span class="cap">${title}</span></div>`;

const LAYOUTS = {

  a() {

  // B: one hero lead with two stacked leads, modules, briefs in three columns, map in the corner.
  b() {
    const side = LEADS.slice(1).map((x) => `<div class="card lead side ${x.r}" style="display:flex">${art(x.art, 120).replace('style="height:120px;', 'style="height:auto;width:170px;flex:none;')}<span class="n">${x.no}</span>${badge(x)}<div class="txt"><div class="k">${x.k}</div><h2 style="font-size:23px">${x.h}</h2><p>${x.d}</p><div class="s">${x.s}</div></div></div>`).join('');
    return head
      + `<div class="row" style="grid-template-columns:1.15fr 1fr">${lead(LEADS[0], 150, 32)}<div style="display:grid;gap:8px">${side}</div></div>`
      + `<div class="row" style="grid-template-columns:repeat(4,1fr)">${MODS.map((x) => mod(x, 38)).join('')}</div>`
      + `<div class="row" style="grid-template-columns:1fr 262px;align-items:start">${notes(2)}<div>${map(262, 104, 'WHERE · pins = story numbers')}`
      + `<div class="ind" style="margin:4px 0 0;grid-template-columns:1fr 1fr 1fr">${IND.map(([a, b]) => `<div style="padding:2px 1px 3px"><b style="font-size:18px;line-height:20px">${a}</b><span style="font-size:9.5px">${b}</span></div>`).join('')}</div></div></div>`
      + check + foot;
  },
  // C: the map leads, with indicators; then leads, modules and briefs keyed to its pins.
  c() {
    return head
      + `<div class="row" style="grid-template-columns:1fr 230px">${map(756, 168, 'WHERE IT HAPPENED · pins = story numbers')}<div class="ind" style="margin:0;grid-template-columns:1fr 1fr;height:168px">${IND.map(([a, b]) => `<div style="padding-top:6px"><b>${a}</b><span>${b}</span></div>`).join('')}</div></div>`
      + `<div class="row" style="grid-template-columns:repeat(3,1fr)">${LEADS.map((x) => lead(x, 50, 23)).join('')}</div>`
      + `<div class="row" style="grid-template-columns:repeat(4,1fr)">${MODS.map((x) => mod(x, 32)).join('')}</div>`
      + `<div class="row">${notes(3)}</div>`
      + check + foot;
  },
};

const pick = new URLSearchParams(location.search).get('layout') || 'b';
document.body.insertAdjacentHTML('beforeend', (LAYOUTS[pick] || LAYOUTS.b)());
</script>
